<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 보이스 생성기</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d1b2a; --bg-card:#1a2d42; --bg-input:#243650;
  --gold:#D4A96A; --moon:#A8C4E8; --green:#7ec8a0; --red:#e07878;
  --text:#e8e0d4; --muted:#8a9db5;
  --border:rgba(168,196,232,0.15); --border-h:rgba(168,196,232,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-weight:300;min-height:100vh;padding:2.5rem 1rem 5rem;}
.wrap{max-width:680px;margin:0 auto;}

header{text-align:center;margin-bottom:2rem;}
.logo{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:var(--gold);letter-spacing:0.1em;}
.logo span{color:var(--moon);}
.tagline{font-size:0.72rem;color:var(--muted);letter-spacing:0.22em;text-transform:uppercase;margin-top:0.3rem;}
.hdivider{width:36px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:1rem auto;}

.mode-tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1.5rem;}
.mode-tab{padding:0.85rem 1rem;background:transparent;border:none;color:var(--muted);font-family:'Noto Sans KR',sans-serif;font-size:0.82rem;font-weight:400;cursor:pointer;transition:all 0.22s;letter-spacing:0.05em;display:flex;align-items:center;justify-content:center;gap:8px;}
.mode-tab.active-m{background:rgba(212,169,106,0.08);color:var(--gold);}
.mode-tab.active-y{background:rgba(168,196,232,0.08);color:var(--moon);}
.mode-tab:first-child{border-right:1px solid var(--border);}

.panel{display:none;} .panel.active{display:block;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:1.4rem;margin-bottom:0.9rem;}
.card-title{font-size:0.67rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:1.1rem;}
label{display:block;font-size:0.72rem;color:var(--muted);margin-bottom:0.38rem;letter-spacing:0.03em;}
input[type="password"],select,textarea{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:0.62rem 0.85rem;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:0.83rem;font-weight:300;outline:none;transition:border-color 0.18s;appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--border-h);}
.field{margin-bottom:1rem;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* Voice grid */
.voice-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.8rem;}
.vf-btn{background:transparent;border:1px solid var(--border);border-radius:16px;padding:0.22rem 0.68rem;font-size:0.7rem;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.17s;}
.vf-btn.active-m{border-color:var(--gold);color:var(--gold);}
.vf-btn.active-y{border-color:var(--moon);color:var(--moon);}
.voice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:7px;margin-bottom:0.5rem;}
.voice-card{background:var(--bg-input);border:1px solid var(--border);border-radius:9px;padding:0.6rem 0.7rem;cursor:pointer;transition:all 0.17s;position:relative;}
.voice-card:hover{border-color:var(--border-h);}
.voice-card.sel-m{border-color:var(--gold);background:rgba(212,169,106,0.06);}
.voice-card.sel-y{border-color:var(--moon);background:rgba(168,196,232,0.06);}
.vc-row{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.vc-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.female .vc-dot{background:var(--moon);} .neutral .vc-dot{background:#9ab8a0;} .male .vc-dot{background:#9ab0c8;}
.vc-name{font-size:0.8rem;font-weight:400;color:var(--text);}
.vc-desc{font-size:0.66rem;color:var(--muted);line-height:1.35;}
.sel-display{font-size:0.73rem;color:var(--gold);margin-top:0.5rem;min-height:1.1rem;}
.sel-display-y{color:var(--moon);}

/* Preview button on voice card */
.preview-btn{position:absolute;top:6px;right:6px;background:transparent;border:none;cursor:pointer;font-size:0.7rem;color:var(--muted);padding:2px 4px;border-radius:4px;transition:color 0.15s;line-height:1;}
.preview-btn:hover{color:var(--moon);}
.preview-btn.playing{color:var(--green);}

/* Byte meter */
.byte-meter{margin-top:0.4rem;}
.byte-bar-bg{height:3px;background:rgba(168,196,232,0.1);border-radius:2px;overflow:hidden;}
.byte-bar{height:3px;border-radius:2px;transition:width 0.2s, background 0.2s;background:var(--moon);}
.byte-bar.warn{background:var(--gold);}
.byte-bar.over{background:var(--red);}
.byte-info{display:flex;justify-content:space-between;font-size:0.68rem;color:var(--muted);margin-top:3px;}
.byte-info span.over{color:var(--red);}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.7rem;}
.chip{background:transparent;border:1px solid var(--border);border-radius:15px;padding:0.22rem 0.68rem;font-size:0.7rem;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.17s;}
.chip:hover{border-color:var(--gold);color:var(--gold);}
.chip-y:hover{border-color:var(--moon);color:var(--moon);}
textarea.style-ta{min-height:75px;resize:vertical;line-height:1.7;font-size:0.81rem;}
.tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:0.5rem;}
.tag-chip{background:rgba(168,196,232,0.04);border:1px solid var(--border);border-radius:5px;padding:0.18rem 0.55rem;font-size:0.68rem;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-style:italic;transition:all 0.15s;}
.tag-chip:hover{border-color:var(--moon);color:var(--moon);}
textarea.script-ta{min-height:160px;resize:vertical;line-height:1.85;}
.sec-label{font-size:0.68rem;color:var(--muted);margin-bottom:0.45rem;letter-spacing:0.03em;}

/* Genre */
.yt-genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:0.5rem;}
.genre-card{background:var(--bg-input);border:1px solid var(--border);border-radius:9px;padding:0.65rem 0.8rem;cursor:pointer;transition:all 0.17s;}
.genre-card:hover{border-color:var(--border-h);}
.genre-card.sel-g{border-color:var(--moon);background:rgba(168,196,232,0.06);}
.gc-icon{font-size:1.2rem;margin-bottom:4px;}
.gc-name{font-size:0.78rem;font-weight:400;color:var(--text);}
.gc-desc{font-size:0.65rem;color:var(--muted);}

/* Generate */
.btn-gen{width:100%;padding:0.95rem;background:transparent;border:1px solid var(--gold);border-radius:10px;color:var(--gold);font-family:'Noto Sans KR',sans-serif;font-size:0.9rem;font-weight:400;letter-spacing:0.12em;cursor:pointer;transition:all 0.22s;margin-top:0.4rem;}
.btn-gen:hover:not(:disabled){background:rgba(212,169,106,0.07);}
.btn-gen-y{border-color:var(--moon);color:var(--moon);}
.btn-gen-y:hover:not(:disabled){background:rgba(168,196,232,0.07);}
.btn-gen:disabled{opacity:0.3;cursor:not-allowed;}
.status{text-align:center;font-size:0.77rem;color:var(--muted);margin-top:0.8rem;min-height:1.1rem;letter-spacing:0.03em;}
.status.err{color:var(--red);} .status.ok{color:var(--green);}

.result-card{display:none;background:var(--bg-card);border:1px solid rgba(212,169,106,0.2);border-radius:12px;padding:1.4rem;margin-top:0.9rem;}
.result-card-y{border-color:rgba(168,196,232,0.2);}
audio{width:100%;margin:0.7rem 0;border-radius:5px;}
.btn-dl{width:100%;padding:0.72rem;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Noto Sans KR',sans-serif;font-size:0.8rem;font-weight:300;letter-spacing:0.07em;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-dl:hover{border-color:var(--moon);color:var(--moon);}

/* History */
.history-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:1.4rem;margin-top:0.9rem;}
.history-list{display:flex;flex-direction:column;gap:8px;margin-top:0.8rem;}
.history-item{background:var(--bg-input);border:1px solid var(--border);border-radius:9px;padding:0.7rem 0.9rem;display:flex;align-items:center;gap:10px;}
.hi-info{flex:1;min-width:0;}
.hi-voice{font-size:0.75rem;font-weight:400;color:var(--text);}
.hi-script{font-size:0.68rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hi-time{font-size:0.65rem;color:var(--muted);flex-shrink:0;}
.hi-btns{display:flex;gap:6px;flex-shrink:0;}
.hi-btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:0.2rem 0.5rem;font-size:0.68rem;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;}
.hi-btn:hover{border-color:var(--moon);color:var(--moon);}
.hi-btn.del:hover{border-color:var(--red);color:var(--red);}
.history-empty{font-size:0.75rem;color:var(--muted);text-align:center;padding:1rem 0;opacity:0.6;}
.history-clear{background:transparent;border:none;font-size:0.68rem;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;float:right;transition:color 0.15s;}
.history-clear:hover{color:var(--red);}

.info-box{background:rgba(168,196,232,0.04);border:1px solid rgba(168,196,232,0.12);border-radius:8px;padding:0.65rem 0.9rem;font-size:0.74rem;color:var(--muted);line-height:1.75;margin-bottom:1rem;}
.info-box a{color:var(--gold);text-decoration:none;}
.tip{font-size:0.68rem;color:var(--muted);text-align:center;margin-top:2rem;line-height:1.9;opacity:0.5;}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">AI <span>Voice</span></div>
  <div class="hdivider"></div>
  <div class="tagline">Gemini TTS · 30 Voices · 한국어</div>
</header>

<div class="mode-tabs">
  <button class="mode-tab active-m" id="tabM" onclick="switchMode('M')">🌙 명상 · 웰니스</button>
  <button class="mode-tab" id="tabY" onclick="switchMode('Y')">▶ 유튜브 · 콘텐츠</button>
</div>



<!-- ══ MEDITATION ══ -->
<div class="panel active" id="panelM">
  <div class="card">
    <div class="card-title">목소리 — 30종</div>
    <div class="voice-filter" id="vfM">
      <button class="vf-btn active-m" onclick="filterVoice('all','M',this)">전체</button>
      <button class="vf-btn" onclick="filterVoice('female','M',this)">여성</button>
      <button class="vf-btn" onclick="filterVoice('neutral','M',this)">중성</button>
      <button class="vf-btn" onclick="filterVoice('male','M',this)">남성</button>
    </div>
    <div class="voice-grid" id="voiceGridM"></div>
    <div class="sel-display" id="selDispM">선택됨: Kore — 차분하고 깊은</div>
  </div>

  <div class="card">
    <div class="card-title">스타일 프롬프트</div>
    <div class="sec-label">프리셋</div>
    <div class="chips">
      <button class="chip" onclick="setPrompt('M','meditation')">명상 기본</button>
      <button class="chip" onclick="setPrompt('M','warm')">따뜻한 친구</button>
      <button class="chip" onclick="setPrompt('M','whisper')">속삭임</button>
      <button class="chip" onclick="setPrompt('M','guide')">안내 명상</button>
      <button class="chip" onclick="setPrompt('M','sleep')">수면 유도</button>
      <button class="chip" onclick="setPrompt('M','inquiry')">자기탐구</button>
    </div>
    <div class="field">
      <label>톤 / 속도 / 감정 지시문</label>
      <textarea class="style-ta" id="stylePM" oninput="updateBytes('M')"></textarea>
    </div>
    <div class="sec-label" style="margin-bottom:0.4rem;">인라인 태그</div>
    <div class="tag-row">
      <button class="tag-chip" onclick="insertTag('M','[whispers]')">[whispers]</button>
      <button class="tag-chip" onclick="insertTag('M','[sighs]')">[sighs]</button>
      <button class="tag-chip" onclick="insertTag('M','[pause]')">[pause]</button>
      <button class="tag-chip" onclick="insertTag('M','[slowly]')">[slowly]</button>
      <button class="tag-chip" onclick="insertTag('M','[gently]')">[gently]</button>
      <button class="tag-chip" onclick="insertTag('M','[warmly]')">[warmly]</button>
      <button class="tag-chip" onclick="insertTag('M','[softly]')">[softly]</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">스크립트</div>
    <div class="chips">
      <button class="chip" onclick="setScript('M','breath')">호흡 명상</button>
      <button class="chip" onclick="setScript('M','body')">바디스캔</button>
      <button class="chip" onclick="setScript('M','inquiry')">내면 탐구</button>
      <button class="chip" onclick="setScript('M','joy')">설렘 탐구</button>
      <button class="chip" onclick="setScript('M','sleep')">수면 유도</button>
    </div>
    <label>텍스트</label>
    <textarea class="script-ta" id="scriptM" oninput="updateBytes('M')" placeholder="명상 스크립트를 입력하세요..."></textarea>
    <div class="byte-meter">
      <div class="byte-bar-bg"><div class="byte-bar" id="byteBarM" style="width:0%"></div></div>
      <div class="byte-info">
        <span id="byteTextM">0 / 8,000 bytes</span>
        <span id="byteWarnM"></span>
      </div>
    </div>
  </div>

  <button class="btn-gen" id="genBtnM" onclick="generate('M')">▷ 음성 생성하기</button>
  <div class="status" id="statusM"></div>
  <div class="result-card" id="resultM">
    <div class="card-title">생성 완료</div>
    <audio id="playerM" controls></audio>
    <button class="btn-dl" id="dlBtnM">↓ &nbsp;WAV 다운로드</button>
  </div>
</div>

<!-- ══ YOUTUBE ══ -->
<div class="panel" id="panelY">
  <div class="card">
    <div class="card-title">목소리 — 30종</div>

    <div class="chips">

      <button class="chip chip-y" onclick="setPrompt('Y','asmr')">ASMR</button>

      <button class="tag-chip" onclick="insertTag('Y','[dramatically]')">[dramatically]</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">스크립트</div>
    <div class="chips">
      <button class="chip chip-y" onclick="setScript('Y','intro')">채널 인트로</button>
      <button class="chip chip-y" onclick="setScript('Y','vlog')">브이로그</button>
      <button class="chip chip-y" onclick="setScript('Y','edu')">교육 강의</button>
      <button class="chip chip-y" onclick="setScript('Y','review')">제품 리뷰</button>

      <button class="chip chip-y" onclick="setScript('Y','outro')">아웃트로</button>
    </div>
    <label>텍스트</label>
    <textarea class="script-ta" id="scriptY" oninput="updateBytes('Y')" placeholder="영상 스크립트를 입력하세요..."></textarea>
    <div class="byte-meter">
      <div class="byte-bar-bg"><div class="byte-bar" id="byteBarY" style="width:0%"></div></div>
      <div class="byte-info">
        <span id="byteTextY">0 / 8,000 bytes</span>
        <span id="byteWarnY"></span>
      </div>
    </div>
  </div>

  <button class="btn-gen btn-gen-y" id="genBtnY" onclick="generate('Y')">▷ 음성 생성하기</button>
  <div class="status" id="statusY"></div>
  <div class="result-card result-card-y" id="resultY">
    <div class="card-title">생성 완료</div>
    <audio id="playerY" controls></audio>
    <button class="btn-dl" id="dlBtnY">↓ &nbsp;WAV 다운로드</button>
  </div>
</div>

<!-- ══ HISTORY ══ -->
<div class="history-card" id="historyCard">
  <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
    <span>최근 생성 기록</span>
    <button class="history-clear" onclick="clearHistory()">전체 삭제</button>

  <div class="history-list" id="historyList"></div>
</div>

<div class="tip">

</div>
</div>

// ── 목소리 미리듣기 (샘플 파일) ──────────────────────
function previewVoice(name,mode,btn){
  // 재생 중이면 정지
  if(previewAudio&&!previewAudio.paused){
    previewAudio.pause();
    if(previewBtn){previewBtn.textContent='▶';previewBtn.classList.remove('playing');}
    if(previewBtn===btn){previewAudio=null;previewBtn=null;return;}
  }

  const url=`samples/${name}.wav`;
  previewAudio=new Audio(url);
  previewBtn=btn;
  btn.textContent='…';

  previewAudio.oncanplay=()=>{
    btn.textContent='■';
    btn.classList.add('playing');
    previewAudio.play();
  };
  previewAudio.onended=()=>{
    btn.textContent='▶';btn.classList.remove('playing');
    previewAudio=null;previewBtn=null;
  };
  previewAudio.onerror=()=>{
    btn.textContent='▶';btn.classList.remove('playing');
    previewAudio=null;previewBtn=null;
  };
  previewAudio.load();
}

// ── 바이트 미터 ───────────────────────────────────────
function getBytes(mode){
  const script=document.getElementById('script'+mode).value;
  const style=document.getElementById('styleP'+mode).value;
  return new TextEncoder().encode(script+style).length;
}

function updateBytes(mode){
  const bytes=getBytes(mode);
  const pct=Math.min(bytes/8000*100,100);
  const bar=document.getElementById('byteBar'+mode);
  const txt=document.getElementById('byteText'+mode);
  const warn=document.getElementById('byteWarn'+mode);
  bar.style.width=pct+'%';
  bar.className='byte-bar'+(bytes>7500?' over':bytes>6000?' warn':'');
  txt.textContent=`${bytes.toLocaleString()} / 8,000 bytes`;
  txt.className=bytes>8000?'over':'';
  warn.textContent=bytes>8000?'⚠ 한도 초과 — 스크립트를 줄여주세요':bytes>7500?'주의: 한도에 근접했어요':'';
  warn.style.color=bytes>8000?'var(--red)':'var(--gold)';
}

// ── PCM → WAV ─────────────────────────────────────────
function pcmToWav(pcmData,sr=24000){
  const nc=1,bps=16,br=sr*nc*bps/8,ba=nc*bps/8,ds=pcmData.byteLength;
  const buf=new ArrayBuffer(44+ds),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+ds,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nc,true);
  v.setUint32(24,sr,true);v.setUint32(28,br,true);v.setUint16(32,ba,true);
  v.setUint16(34,bps,true);w(36,'data');v.setUint32(40,ds,true);
  new Uint8Array(buf,44).set(new Uint8Array(pcmData));
  return new Blob([buf],{type:'audio/wav'});
}

// ── 생성 기록 ─────────────────────────────────────────
const HISTORY_KEY='aivoice_history';
const MAX_HISTORY=5;

function loadHistory(){return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');}
function saveHistory(list){localStorage.setItem(HISTORY_KEY,JSON.stringify(list));}

function addHistory(mode,voice,script,url){
  const list=loadHistory();
  list.unshift({id:Date.now(),mode,voice,script:script.slice(0,80),url,time:new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});
  if(list.length>MAX_HISTORY)list.pop();
  saveHistory(list);
  renderHistory();
}

function renderHistory(){
  const list=loadHistory();
  const el=document.getElementById('historyList');
  if(!list.length){el.innerHTML='<div class="history-empty">아직 생성 기록이 없어요</div>';return;}
  el.innerHTML=list.map(h=>`
    <div class="history-item" id="hi${h.id}">
      <div class="hi-info">
        <div class="hi-voice">${h.mode==='M'?'🌙':'▶'} ${h.voice}</div>
        <div class="hi-script">${h.script}${h.script.length>=80?'...':''}</div>
      </div>
      <div class="hi-time">${h.time}</div>
      <div class="hi-btns">
        <button class="hi-btn" onclick="replayHistory('${h.id}')">▶ 재생</button>
        <button class="hi-btn del" onclick="deleteHistory(${h.id})">✕</button>
      </div>
    </div>
  `).join('');
}

function replayHistory(id){
  const list=loadHistory();
  const h=list.find(h=>h.id==id);
  if(!h||!h.url)return;
  const playerId=h.mode==='M'?'playerM':'playerY';
  const resultId='result'+h.mode;
  document.getElementById(playerId).src=h.url;
  document.getElementById(resultId).style.display='block';
  document.getElementById(playerId).play();
  switchMode(h.mode);
  window.scrollTo({top:0,behavior:'smooth'});
}

function deleteHistory(id){
  const list=loadHistory().filter(h=>h.id!==id);
  saveHistory(list);renderHistory();
}

function clearHistory(){
  saveHistory([]);renderHistory();
}

// ── 생성 ─────────────────────────────────────────────
async function generate(mode){
  const script=document.getElementById('script'+mode).value.trim();
  const styleP=document.getElementById('styleP'+mode).value.trim();
  const voice=selVoice[mode];
  if(!script){setStatus(mode,'스크립트를 입력해주세요.','err');return;}
  if(getBytes(mode)>8000){setStatus(mode,'스크립트가 너무 길어요. 8,000 bytes 이하로 줄여주세요.','err');return;}

  const btn=document.getElementById('genBtn'+mode);
  btn.disabled=true;
  setStatus(mode,'생성 중... 잠시만 기다려주세요.','');

  const fullText=styleP?styleP+'\n\n'+script:script;
  try{
    const res=await fetch(
      WORKER_URL,
      {method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({
         contents:[{parts:[{text:fullText}]}],
         generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}
       })}
    );
    if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'오류');}
    const data=await res.json();
    const audioData=data?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
    if(!audioData)throw new Error('오디오 데이터를 받지 못했습니다.');

    const bin=atob(audioData),pcmBuf=new ArrayBuffer(bin.length),pv=new Uint8Array(pcmBuf);
    for(let i=0;i<bin.length;i++)pv[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(pcmToWav(pcmBuf));

    document.getElementById('player'+mode).src=url;
    document.getElementById('dlBtn'+mode).onclick=()=>{
      const a=document.createElement('a');a.href=url;
      a.download=`voice_${voice}_${new Date().toISOString().slice(0,10)}.wav`;a.click();
    };
    document.getElementById('result'+mode).style.display='block';
    setStatus(mode,`완료! 목소리: ${voice}`,'ok');
    addHistory(mode,voice,script,url);
  }catch(e){
    setStatus(mode,'오류: '+e.message,'err');
  }finally{
    btn.disabled=false;
  }
}

function setStatus(mode,msg,type){
  const el=document.getElementById('status'+mode);
  el.textContent=msg;el.className='status'+(type?' '+type:'');
}

// ── 초기화 ────────────────────────────────────────────
renderVoices('all','M');
renderVoices('all','Y');
renderGenres();
setPrompt('M','meditation');
setPrompt('Y','narration');
renderHistory();
</script>
